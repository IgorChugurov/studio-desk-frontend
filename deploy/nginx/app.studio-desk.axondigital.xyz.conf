# nginx site for the studio admin. Copied by hand to
#   /etc/nginx/sites-available/app.studio-desk.axondigital.xyz
# certbot --nginx adds the HTTPS part to this file.
# The Host header must reach the frontend: it chooses the surface by host.
server {
    listen 80;
    listen [::]:80;
    server_name app.studio-desk.axondigital.xyz;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
